<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kesh Vardhak Hair Oil – 57 Natural Ingredients</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#fdfcd1;
--hero:#f9f8c6;
--accent:#c4c43a;
--green:#2e8b57;
}

body{
font-family:'Plus Jakarta Sans',sans-serif;
background:var(--bg);
overflow-x:hidden;
}

/* floating herbal background */

.bg-leaf{
position:fixed;
width:400px;
height:400px;
background:radial-gradient(circle,#f4f4a5 0%,transparent 70%);
opacity:.6;
z-index:-1;
animation:float 12s ease-in-out infinite;
}

.bg-leaf2{
position:fixed;
right:-120px;
bottom:-120px;
width:420px;
height:420px;
background:radial-gradient(circle,#dff7e5 0%,transparent 70%);
opacity:.5;
z-index:-1;
animation:float2 16s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(30px)}
100%{transform:translateY(0)}
}

@keyframes float2{
0%{transform:translateY(0)}
50%{transform:translateY(-40px)}
100%{transform:translateY(0)}
}

/* hero */

.hero{
background:linear-gradient(180deg,#faf9d6,#f4f3b0);
border-bottom:1px solid rgba(0,0,0,.05);
}

.hero h1{
font-family:'Playfair Display',serif;
}

/* ingredient card */

.ingredient{
background:white;
border:1px solid rgba(0,0,0,.05);
transition:.25s;
}

.ingredient:hover{
transform:translateY(-3px);
box-shadow:0 10px 22px rgba(0,0,0,.06);
border-color:#e6e678;
}

/* reveal animation */

.reveal{
opacity:0;
transform:translateY(8px);
animation:reveal .4s forwards;
}

@keyframes reveal{
to{
opacity:1;
transform:translateY(0);
}
}

/* sticky search */

.searchBar{
position:sticky;
top:0;
backdrop-filter:blur(10px);
background:rgba(253,252,209,.8);
z-index:50;
}

/* category chips */

.category-chip{
background:white;
border:1px solid rgba(0,0,0,.06);
}

.category-chip.active{
background:#fff9d6;
border-color:#e7e76a;
}

</style>

</head>

<body class="text-slate-800">

<div class="bg-leaf"></div>
<div class="bg-leaf2"></div>

<!-- HERO -->

<section class="hero text-center pt-14 pb-10 px-6 rounded-b-[40px]">

<h1 class="text-3xl font-bold text-slate-900">Kesh Vardhak Hair Oil</h1>

<p class="text-sm text-slate-600 mt-2 max-w-xs mx-auto">
Traditional Ayurvedic formulation crafted using
<b>57 natural ingredients</b>
</p>

<div class="mt-6 inline-block bg-white/70 px-6 py-3 rounded-xl border border-black/5 shadow-sm">
<!-- <p class="text-xs tracking-[0.25em] uppercase text-slate-500 font-semibold">Sampoorna Padarthalu</p> -->
<p class="text-lg font-bold">Complete Ingredient List</p>
</div>

</section>


<div class="max-w-[480px] mx-auto px-4 pb-16">

<!-- SEARCH -->

<div class="searchBar py-3 mt-2">

<input
id="search"
placeholder="Search ingredients..."
class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-4 focus:ring-yellow-400/20 text-sm shadow-sm"
/>

</div>


<!-- CATEGORY FILTER -->

<div class="flex gap-2 mt-4 overflow-x-auto pb-2">

<button data-filter="all" class="category-chip active px-3 py-1.5 rounded-full text-xs font-semibold">
All
</button>

<button data-filter="herb" class="category-chip px-3 py-1.5 rounded-full text-xs font-semibold">
🌿 Herbs
</button>

<button data-filter="leaf" class="category-chip px-3 py-1.5 rounded-full text-xs font-semibold">
🍃 Leaves
</button>

<button data-filter="oil" class="category-chip px-3 py-1.5 rounded-full text-xs font-semibold">
🫒 Oils
</button>

</div>


<!-- INGREDIENT LIST -->

<div id="list" class="grid grid-cols-1 gap-2 mt-4"></div>


<!-- FOOTER -->

<div class="text-center mt-12">

<button id="share"
class="bg-white border border-slate-200 px-6 py-2 rounded-full text-xs font-semibold shadow-sm hover:bg-slate-50 transition">

Share Ingredients

</button>

<p class="text-[10px] mt-6 text-slate-400 tracking-[0.3em] uppercase">
Prakruti Prasuddhata
</p>

</div>

</div>


<script>

const ingredients = [

{no:1, text:"Karakkayi"},
{no:2, text:"Tanikayi"},
{no:3, text:"Jatamasi"},
{no:4, text:"Satavari"},
{no:5, text:"Bhringaraj"},
{no:6, text:"Yastimadhu"},
{no:7, text:"Marri Udalu"},
{no:8, text:"Nagarmotha (Tunga Mustalu)"},
{no:9, text:"Henna Powder(Gorinta Choornam)"},
{no:10, text:"Ashwagandha"},
{no:11, text:"Neeli (Indigo)"},
{no:12, text:"Saribha(Sugandhi pala)"},
{no:13, text:"Gandha cahuralu"},
{no:14, text:"Bhum amlaka (Nelausiri)"},
{no:15, text:"Chengalva Kosht (Koshtam)"},
{no:16, text:"Ritha (Kunkudi kaya churnam)"},
{no:17, text:"Useera (Vatti Veru)(Lavancha)"},
{no:18, text:"Manu pasupu"},
{no:19, text:"Nagakesar"},
{no:20, text:"Bhavanchal"},
{no:21, text:"Vacha"},
{no:22, text:"Red Sandal"},
{no:23, text:"Stone flower (Chadila)"},
{no:24, text:"Bitter Apple Root (indrayan Phal Powder)(Citrullus Colocynthis"},
{no:25, text:"Mandara Choornam (Hibiscus Flowers Powder)"},
{no:26, text:"Manjistha(Rubia Cardifolia)(Tamaralli)"},
{no:27, text:"Devadaru"},
{no:28, text:"Shikakai Choornam (acacia Cinna)"},
{no:29, text:"Nalla Jeelakarra(Black Jeera)"},
{no:30, text:"Brahmi powder(Bacopa Munnieri)"},
{no:31, text:"Ratanjot Root(Onasma echioides) (Alkanet Root)  (Alkana Tinctoria)"},
{no:32, text:"Jyotismati oil (Malkangan Taila) (Celastrus Paniculatus)   (Brahmi Karanji-Telugu)"},
{no:33, text:"Nalla Jeelakarra(Black Jeera)"},
{no:34, text:"Rose hip oil"},
{no:35, text:"Balloon Vine, Budda Kakara, Kanphata/ Kapaalphoti in hindi , Mudakathan Keerai Powder Tamil (Cardiospermum halicacabum)"},
{no:36, text:"Mayur Sikha/ mor sikha (Adiantum Caudatum)"},
{no:37, text:"Haldi (turmeric)"},
{no:38, text:"Methi Seeds"},
{no:39, text:"Flax seeds"},
{no:40, text:"Castor oil (Ricinis Cummunis)"},
{no:41, text:"Jaggery"},
{no:42, text:"Lemons Fresh"},
{no:43, text:"Pudina -Green"},
{no:44, text:"Beetel leaves - Green"},
{no:45, text:"Curry leave- Green"},
{no:46, text:"Neem leaves-Green"},
{no:47, text:"Mandukaparni leaves -Green"},
{no:48, text:"Gaduchi- Green"},
{no:49, text:"Ponnaganti kura-Green"},
{no:50, text:"Sankapuspi- Green"},
{no:51, text:"Aloe vera - Green"},
{no:52, text:"Tulsi Leaves- Green"},
{no:53, text:"Moringa leaves - Green (Mulaga/Drum stick leaves)"},
{no:54, text:"Amla Fruits- Green"},
{no:55, text:"Badam oil"},
{no:56, text:"Gingelly oil (Sesame oil)"},
{no:57, text:"Coconut oil"}

];

const list=document.getElementById("list");
const search=document.getElementById("search");

function render(filter=""){

list.innerHTML="";

const filtered=ingredients.filter(i =>
i.text.toLowerCase().includes(filter.toLowerCase())
);

filtered.forEach((item,i)=>{

const div=document.createElement("div");

div.className="ingredient p-3 rounded-xl flex items-center reveal";

div.style.animationDelay=(i*0.02)+"s";

div.innerHTML=`

<div class="w-7 h-7 mr-3 bg-yellow-50 border border-yellow-100 flex items-center justify-center rounded">
<span class="text-[10px] font-bold text-yellow-800">${item.no}</span>
</div>

<span class="text-sm font-semibold text-slate-700">${item.text}</span>

`;

list.appendChild(div);

});

}

render();

search.addEventListener("input",e=>render(e.target.value));

</script>

</body>
</html>
